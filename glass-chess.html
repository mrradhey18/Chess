<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Glass Chess</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
<style>
  :root{
    --glass-bg: rgba(255,255,255,0.14);
    --glass-bg-strong: rgba(255,255,255,0.22);
    --glass-border: rgba(255,255,255,0.35);
    --ink: #0b1e33;
    --ink-soft: rgba(11,30,51,0.62);
    --accent: #3ec9ff;
    --accent-2: #6a7bff;
    --white-piece: #f8fbff;
    --black-piece: #16233a;
    --light-sq: rgba(255,255,255,0.55);
    --dark-sq: rgba(120,150,190,0.38);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    overflow-x:hidden;
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(1100px 700px at 15% -10%, #bfe9ff 0%, rgba(191,233,255,0) 60%),
      radial-gradient(1000px 800px at 110% 10%, #d9d0ff 0%, rgba(217,208,255,0) 55%),
      radial-gradient(900px 700px at 50% 120%, #ffe3f1 0%, rgba(255,227,241,0) 60%),
      linear-gradient(160deg, #eaf3ff 0%, #f4f0ff 45%, #ffeef6 100%);
    background-attachment: fixed;
  }
  .app{
    max-width: 560px;
    margin: 0 auto;
    min-height:100dvh;
    padding: max(18px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }

  /* ---------- glass primitives ---------- */
  .glass{
    background: var(--glass-bg);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.6) inset,
      0 8px 30px rgba(31,60,110,0.14);
  }
  .glass-strong{
    background: var(--glass-bg-strong);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.7) inset,
      0 10px 40px rgba(31,60,110,0.18);
  }
  button{ font-family:inherit; }
  .btn{
    appearance:none; border:none; cursor:pointer;
    padding: 14px 20px;
    border-radius: 18px;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    background: var(--glass-bg-strong);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 6px 18px rgba(31,60,110,0.14);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active{ transform: scale(0.96); box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 2px 8px rgba(31,60,110,0.14); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.primary{
    color:#fff;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 8px 22px rgba(80,120,255,0.35);
  }
  .btn.danger{
    color:#a3213a;
  }
  .btn.small{ padding:9px 14px; font-size:13px; border-radius:14px; }
  input[type=text]{
    font-family:inherit;
    font-size: 22px;
    font-weight:700;
    letter-spacing: 4px;
    text-align:center;
    text-transform:uppercase;
    color: var(--ink);
    background: rgba(255,255,255,0.35);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 14px 10px;
    width:100%;
    outline:none;
  }
  input[type=text]::placeholder{ color: rgba(11,30,51,0.3); letter-spacing:2px; font-weight:600;}

  /* ---------- landing ---------- */
  .brand{
    text-align:center;
    margin: 18px 0 28px;
  }
  .brand .mark{
    width:64px;height:64px;margin:0 auto 12px;
    border-radius: 20px;
    display:flex;align-items:center;justify-content:center;
    font-size:34px;
    background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.25));
    border:1px solid var(--glass-border);
    box-shadow: 0 10px 30px rgba(90,120,255,0.25), 0 1px 0 rgba(255,255,255,0.8) inset;
  }
  .brand h1{
    margin:0; font-size:28px; letter-spacing:-0.02em; font-weight:800;
    background: linear-gradient(135deg, #1a2b4a, #4a5fc7 60%, #1a2b4a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand p{ margin:6px 0 0; color:var(--ink-soft); font-size:14px; }

  .card{
    border-radius: 26px;
    padding: 22px;
    margin-bottom: 16px;
  }
  .card h2{ margin:0 0 4px; font-size:15px; font-weight:700; }
  .card .sub{ margin:0 0 14px; font-size:13px; color:var(--ink-soft); }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  .divider{
    display:flex; align-items:center; gap:12px; margin: 18px 0; color: var(--ink-soft); font-size:12px; font-weight:600;
  }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background: rgba(11,30,51,0.15); }

  /* ---------- game screen ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    border-radius: 20px;
    padding: 12px 16px;
    margin-bottom: 14px;
  }
  .topbar .room{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .topbar .room b{ color:var(--ink); letter-spacing:2px; font-size:15px; }
  .players{
    display:flex; justify-content:space-between; align-items:center;
    border-radius: 20px; padding: 12px 16px; margin-bottom: 12px;
    gap: 10px;
  }
  .player{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; }
  .player .dot{ width:12px; height:12px; border-radius:50%; border:1px solid rgba(0,0,0,0.15); }
  .player.you{ color: var(--accent-2); }
  .turn-pill{
    font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px;
    background: rgba(62,201,255,0.18); color:#0a6a8f; border:1px solid rgba(62,201,255,0.35);
  }
  .turn-pill.mine{ background: linear-gradient(135deg, var(--accent-2), var(--accent)); color:#fff; border-color:transparent; }

  .board-wrap{
    border-radius: 28px;
    padding: 12px;
    margin-bottom: 14px;
    position:relative;
  }
  #board{
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width:100%;
    aspect-ratio: 1/1;
    border-radius: 18px;
    overflow:hidden;
    border: 1px solid rgba(255,255,255,0.5);
  }
  .sq{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    font-size: 7.2vw;
    max-font-size: 40px;
    user-select:none;
    cursor:pointer;
  }
  @media (min-width:560px){ .sq{ font-size:40px; } }
  .sq.light{ background: var(--light-sq); }
  .sq.dark{ background: var(--dark-sq); }
  .sq .piece{
    line-height:1;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    transition: transform .12s ease;
  }
  .sq.selected::after{
    content:""; position:absolute; inset:4%;
    border-radius: 30%;
    box-shadow: 0 0 0 3px rgba(62,201,255,0.9) inset;
  }
  .sq.last::before{
    content:""; position:absolute; inset:0;
    background: rgba(255, 214, 92, 0.35);
  }
  .sq .dot-move{
    position:absolute; width:26%; height:26%; border-radius:50%;
    background: rgba(20,40,80,0.28);
  }
  .sq .ring-capture{
    position:absolute; inset:6%; border-radius:30%;
    box-shadow: 0 0 0 4px rgba(20,40,80,0.28) inset;
  }
  .sq.in-check::before{
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle, rgba(255,80,80,0.55), rgba(255,80,80,0) 70%);
  }
  .coord{
    position:absolute; font-size:9px; font-weight:700; opacity:0.35; pointer-events:none;
  }
  .coord.file{ bottom:2px; right:3px; }
  .coord.rank{ top:2px; left:3px; }

  .status-strip{
    text-align:center; font-size:13px; font-weight:600; color: var(--ink-soft);
    padding: 6px 4px 14px;
    min-height: 18px;
  }

  .controls{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .controls .btn{ flex:1; }

  .history-card{
    border-radius: 22px; padding: 16px 16px 8px; margin-bottom: 14px;
  }
  .history-card h3{ margin:0 0 10px; font-size:13px; font-weight:700; color: var(--ink-soft); display:flex; justify-content:space-between; align-items:center;}
  .moves{
    display:grid; grid-template-columns: 28px 1fr 1fr; gap:4px 8px;
    max-height: 160px; overflow-y:auto; font-size:14px; padding-bottom:8px;
  }
  .moves .num{ color:var(--ink-soft); font-weight:600; font-size:12px; padding-top:6px;}
  .movecell{
    padding:6px 8px; border-radius:10px; font-weight:600; cursor:pointer;
    background: rgba(255,255,255,0.25);
  }
  .movecell.active{ background: linear-gradient(135deg, var(--accent-2), var(--accent)); color:#fff; }
  .movecell:empty{ background:none; cursor:default; }

  .preview-banner{
    display:flex; align-items:center; justify-content:space-between;
    border-radius: 16px; padding: 10px 14px; margin-bottom: 10px;
    background: rgba(255,214,92,0.25); border:1px solid rgba(255,180,60,0.4);
    font-size:13px; font-weight:600;
  }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    padding: 12px 20px; border-radius:16px; font-size:14px; font-weight:600;
    opacity:0; transition: all .25s ease; pointer-events:none; z-index:50;
    max-width: 88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .hidden{ display:none !important; }

  .footer-note{ text-align:center; font-size:11px; color: var(--ink-soft); margin-top:auto; padding-top:18px; }

  ::-webkit-scrollbar{ width:5px; height:5px; }
  ::-webkit-scrollbar-thumb{ background: rgba(11,30,51,0.2); border-radius:10px; }

  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(11,30,51,0.2); border-top-color: var(--accent-2);
    animation: spin .8s linear infinite; display:inline-block; vertical-align:-3px; margin-right:6px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .modal-backdrop{
    position:fixed; inset:0; background: rgba(20,30,50,0.25); backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center; z-index:60; padding:24px;
  }
  .modal{
    border-radius:26px; padding:26px; max-width:340px; width:100%; text-align:center;
  }
  .modal .big{ font-size:44px; margin-bottom:6px; }
  .modal h2{ margin:0 0 6px; font-size:20px; }
  .modal p{ margin:0 0 18px; font-size:14px; color:var(--ink-soft); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============ helpers ============ */
const $ = (sel, root) => (root||document).querySelector(sel);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; };
const app = $('#app');
const toastEl = $('#toast');
let toastTimer=null;
function toast(msg, ms){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), ms||2200);
}

function randCode(len){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function uid(){ return 'p_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

const PIECES = {
  w: { p:'♙', n:'♘', b:'♗', r:'♖', q:'♕', k:'♔' },
  b: { p:'♟', n:'♞', b:'♝', r:'♜', q:'♛', k:'♚' }
};

/* ============ persistent identity ============ */
const MY_ID = uid();

/* ============ state ============ */
let state = {
  screen: 'home',      // home | lobby(waiting) | game
  roomCode: null,
  color: null,          // 'w' or 'b'
  chess: null,          // chess.js instance reflecting the LIVE game
  room: null,           // last-known room object from storage
  selected: null,       // selected square e.g. 'e2'
  legalTargets: [],     // squares selectable from `selected`
  previewIndex: null,   // if not null, we are viewing history at this ply index (0-based, after move i played)
  polling: null,
  lastMoveSquares: null, // [from,to]
  pendingTakeback: false
};

/* ============ storage-backed room model ============
room = {
  code, createdAt,
  white: {id, joinedAt} | null,
  black: {id, joinedAt} | null,
  moves: [ 'e4', 'e5', ... ]  (SAN list, in order),
  moveMeta: [ {by:'w'|'b'} ... ] // parallel array
  status: 'waiting'|'active'|'over'
  resultText: string|null
}
=============================================== */

async function loadRoom(code){
  try{
    const r = await window.storage.get('room:'+code, true);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function saveRoom(room){
  try{
    await window.storage.set('room:'+room.code, JSON.stringify(room), true);
  }catch(e){ console.error('save failed', e); }
}

function freshRoom(code){
  return {
    code, createdAt: Date.now(),
    white: null, black: null,
    moves: [], moveMeta: [],
    status: 'waiting', resultText: null
  };
}

/* rebuild a chess.js instance by replaying SAN moves */
function replay(moves){
  const c = new Chess();
  for(const m of moves){
    const res = c.move(m);
    if(!res){ break; }
  }
  return c;
}

/* ============ render root ============ */
function render(){
  app.innerHTML='';
  if(state.screen==='home') renderHome();
  else if(state.screen==='lobby') renderLobby();
  else if(state.screen==='game') renderGame();
}

/* ============ HOME SCREEN ============ */
function renderHome(){
  const brand = el('div','brand');
  brand.innerHTML = `
    <div class="mark">♞</div>
    <h1>Glass Chess</h1>
    <p>Play a live game with a friend using a room code</p>
  `;
  app.appendChild(brand);

  const createCard = el('div','card glass-strong');
  createCard.innerHTML = `
    <h2>Start a room</h2>
    <p class="sub">Get a code, send it to your opponent</p>
  `;
  const createBtn = el('button','btn primary', 'Create room');
  createBtn.style.width='100%';
  createBtn.onclick = onCreateRoom;
  createCard.appendChild(createBtn);
  app.appendChild(createCard);

  app.appendChild(el('div','divider','or'));

  const joinCard = el('div','card glass');
  joinCard.innerHTML = `
    <h2>Join a room</h2>
    <p class="sub">Enter the code your friend sent you</p>
  `;
  const input = el('input'); input.type='text'; input.maxLength=5; input.placeholder='CODE';
  input.autocapitalize='characters'; input.autocomplete='off'; input.spellcheck=false;
  const joinRow = el('div','row');
  joinRow.style.marginTop='12px';
  const joinBtn = el('button','btn','Join');
  joinRow.appendChild(input);
  joinCard.appendChild(input);
  const gap = el('div'); gap.style.height='10px'; joinCard.appendChild(gap);
  joinCard.appendChild(joinBtn);
  joinBtn.onclick = ()=> onJoinRoom(input.value.trim().toUpperCase());
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') onJoinRoom(input.value.trim().toUpperCase()); });
  app.appendChild(joinCard);

  app.appendChild(el('div','footer-note','Board syncs live between both players • Takebacks allowed on your own moves'));
}

async function onCreateRoom(){
  let code;
  let room;
  // ensure uniqueness (best-effort)
  for(let attempt=0; attempt<5; attempt++){
    code = randCode(4);
    const existing = await loadRoom(code);
    if(!existing){ break; }
  }
  room = freshRoom(code);
  room.white = { id: MY_ID, joinedAt: Date.now() };
  await saveRoom(room);
  state.roomCode = code;
  state.color = 'w';
  state.room = room;
  state.chess = new Chess();
  state.screen = 'lobby';
  render();
  startPolling();
}

async function onJoinRoom(code){
  if(!code || code.length<3){ toast('Enter a valid room code'); return; }
  const room = await loadRoom(code);
  if(!room){ toast('Room not found'); return; }

  // figure out seat
  if(room.white && room.white.id===MY_ID){ state.color='w'; }
  else if(room.black && room.black.id===MY_ID){ state.color='b'; }
  else if(!room.black){
    room.black = { id: MY_ID, joinedAt: Date.now() };
    room.status = room.white ? 'active' : 'waiting';
    await saveRoom(room);
    state.color='b';
  } else if(!room.white){
    room.white = { id: MY_ID, joinedAt: Date.now() };
    room.status = 'active';
    await saveRoom(room);
    state.color='w';
  } else {
    // room full, join as spectator (view only) as black perspective viewer
    state.color = 'spectator';
    toast('Room is full — joining as spectator');
  }

  state.roomCode = code;
  state.room = room;
  state.chess = replay(room.moves);
  state.screen = (room.white && room.black) ? 'game' : 'lobby';
  render();
  startPolling();
}

/* ============ LOBBY (waiting for opponent) ============ */
function renderLobby(){
  const top = el('div','topbar glass');
  top.innerHTML = `<div class="room">Room code<br><b>${state.roomCode}</b></div>`;
  const leaveBtn = el('button','btn small','Leave');
  leaveBtn.onclick = leaveRoom;
  top.appendChild(leaveBtn);
  app.appendChild(top);

  const card = el('div','card glass-strong');
  card.style.textAlign='center';
  card.style.marginTop='30px';
  card.innerHTML = `
    <div style="font-size:46px;margin-bottom:10px;">♟️</div>
    <h2 style="font-size:18px;">Waiting for opponent…</h2>
    <p class="sub">Share this code so they can join</p>
    <div style="font-size:40px;font-weight:800;letter-spacing:8px;margin:14px 0;
      background:linear-gradient(135deg,#1a2b4a,#4a5fc7 60%,#1a2b4a);
      -webkit-background-clip:text;background-clip:text;color:transparent;">${state.roomCode}</div>
  `;
  const copyBtn = el('button','btn primary','Copy code');
  copyBtn.style.width='100%';
  copyBtn.onclick = ()=>{
    if(navigator.clipboard){ navigator.clipboard.writeText(state.roomCode).then(()=>toast('Code copied')); }
    else toast(state.roomCode);
  };
  card.appendChild(copyBtn);
  app.appendChild(card);

  const hint = el('div','footer-note', `You are playing as ${state.color==='w'?'White ♙':'Black ♟'}`);
  app.appendChild(hint);
}

function leaveRoom(){
  stopPolling();
  state = { screen:'home', roomCode:null, color:null, chess:null, room:null, selected:null,
    legalTargets:[], previewIndex:null, polling:null, lastMoveSquares:null, pendingTakeback:false };
  render();
}

/* ============ POLLING ============ */
function startPolling(){
  stopPolling();
  state.polling = setInterval(pollRoom, 1400);
}
function stopPolling(){
  if(state.polling){ clearInterval(state.polling); state.polling=null; }
}
async function pollRoom(){
  if(!state.roomCode) return;
  const fresh = await loadRoom(state.roomCode);
  if(!fresh) return;
  const prevMoveCount = state.room ? state.room.moves.length : 0;
  const changed = JSON.stringify(fresh) !== JSON.stringify(state.room);
  state.room = fresh;

  if(state.color==='spectator'){
    // nothing to claim
  } else if(state.color==='w' && (!fresh.white || fresh.white.id!==MY_ID)){
    // seat got overwritten somehow; ignore
  }

  // transition lobby -> game once both seats filled
  if(state.screen==='lobby' && fresh.white && fresh.black){
    state.screen='game';
  }

  if(changed){
    state.chess = replay(fresh.moves);
    if(fresh.moves.length>prevMoveCount){
      const lastSan = fresh.moves[fresh.moves.length-1];
      // figure out from/to of last move by diffing chess history verbose
      const verbose = replayVerbose(fresh.moves);
      const lastV = verbose[verbose.length-1];
      state.lastMoveSquares = lastV ? [lastV.from, lastV.to] : null;
      if(state.previewIndex===null){
        // subtle notification if it was opponent's move
      }
    }
    if(state.previewIndex===null){
      state.selected=null; state.legalTargets=[];
    }
    render();
  }
}

function replayVerbose(moves){
  const c = new Chess();
  const out=[];
  for(const m of moves){
    const r = c.move(m);
    if(!r) break;
    out.push(r);
  }
  return out;
}

/* ============ GAME SCREEN ============ */
function renderGame(){
  const room = state.room;
  const liveChess = state.chess;
  const viewingHistory = state.previewIndex!==null && state.previewIndex < room.moves.length-1;

  // board shown: either live position, or replayed-to preview index
  let displayChess = liveChess;
  if(state.previewIndex!==null){
    displayChess = replay(room.moves.slice(0, state.previewIndex+1));
  }

  const myTurn = state.color===liveChess.turn() && state.color!=='spectator' && state.previewIndex===null;

  /* top bar */
  const top = el('div','topbar glass');
  top.innerHTML = `<div class="room">Room<br><b>${state.roomCode}</b></div>`;
  const leaveBtn = el('button','btn small','Leave');
  leaveBtn.onclick = leaveRoom;
  top.appendChild(leaveBtn);
  app.appendChild(top);

  /* players row */
  const playersRow = el('div','players glass');
  const whiteTag = el('div','player'+(state.color==='w'?' you':''), `<span class="dot" style="background:#fff;border-color:#999"></span> White${state.color==='w'?' (you)':''}`);
  const blackTag = el('div','player'+(state.color==='b'?' you':''), `<span class="dot" style="background:#222"></span> Black${state.color==='b'?' (you)':''}`);
  const pill = el('div','turn-pill'+ (myTurn?' mine':''),
    liveChess.game_over() ? 'Game over' : (liveChess.turn()==='w' ? "White's move" : "Black's move"));
  playersRow.appendChild(whiteTag);
  playersRow.appendChild(pill);
  playersRow.appendChild(blackTag);
  app.appendChild(playersRow);

  if(!room.black && state.color!=='spectator'){
    const waitBanner = el('div','preview-banner');
    waitBanner.innerHTML = `<span><span class="spinner"></span>Waiting for opponent to join…</span>`;
    app.appendChild(waitBanner);
  }

  if(viewingHistory){
    const banner = el('div','preview-banner');
    banner.innerHTML = `<span>👀 Viewing move ${state.previewIndex+1} of ${room.moves.length}</span>`;
    const backBtn = el('button','btn small','Back to live');
    backBtn.onclick = ()=>{ state.previewIndex=null; render(); };
    banner.appendChild(backBtn);
    app.appendChild(banner);
  }

  /* board */
  const boardWrap = el('div','board-wrap glass-strong');
  const boardEl = el('div'); boardEl.id='board';
  boardWrap.appendChild(boardEl);
  app.appendChild(boardWrap);

  const flip = state.color==='b';
  drawBoard(boardEl, displayChess, flip, !viewingHistory && state.color!=='spectator');

  /* status strip */
  let statusMsg = '';
  if(liveChess.in_checkmate()) statusMsg = (liveChess.turn()==='w'?'Black':'White') + ' wins by checkmate';
  else if(liveChess.in_stalemate()) statusMsg = 'Draw by stalemate';
  else if(liveChess.in_draw()) statusMsg = 'Draw';
  else if(liveChess.in_check()) statusMsg = (liveChess.turn()==='w'?'White':'Black') + ' is in check';
  app.appendChild(el('div','status-strip', statusMsg));

  /* controls: takeback */
  const controls = el('div','controls');
  const canTakeback = canITakeback(room, state.color, liveChess);
  const tbBtn = el('button','btn danger', state.pendingTakeback ? '<span class="spinner"></span>Undoing…' : '↩ Take back my move');
  tbBtn.disabled = !canTakeback || state.pendingTakeback || state.previewIndex!==null;
  tbBtn.onclick = doTakeback;
  controls.appendChild(tbBtn);
  app.appendChild(controls);

  /* move history */
  const histCard = el('div','history-card glass');
  const histTitle = el('h3');
  histTitle.innerHTML = `<span>Move history</span><span style="font-weight:500;opacity:.7">${room.moves.length} ply</span>`;
  histCard.appendChild(histTitle);
  const movesGrid = el('div','moves');
  for(let i=0;i<room.moves.length;i+=2){
    const num = el('div','num', String(i/2+1)+'.');
    movesGrid.appendChild(num);
    const whiteCell = el('div','movecell'+(state.previewIndex===i?' active':''), room.moves[i]||'');
    whiteCell.onclick = ()=>{ state.previewIndex=i; render(); };
    movesGrid.appendChild(whiteCell);
    if(room.moves[i+1]!==undefined){
      const blackCell = el('div','movecell'+(state.previewIndex===i+1?' active':''), room.moves[i+1]);
      blackCell.onclick = ()=>{ state.previewIndex=i+1; render(); };
      movesGrid.appendChild(blackCell);
    } else {
      movesGrid.appendChild(el('div','movecell',''));
    }
  }
  histCard.appendChild(movesGrid);
  app.appendChild(histCard);

  if(room.moves.length>0 && state.previewIndex===null){
    const jumpRow = el('div','row');
    jumpRow.style.marginBottom='14px';
    const startBtn = el('button','btn small','⏮ Start');
    startBtn.onclick = ()=>{ state.previewIndex = -1<0? 0 : 0; state.previewIndex = null; jumpToPly(-1); };
    const liveBtn = el('button','btn small','Live position');
    liveBtn.onclick = ()=>{ state.previewIndex=null; render(); };
    jumpRow.appendChild(startBtn);
    jumpRow.appendChild(liveBtn);
    app.appendChild(jumpRow);
  }
}

function jumpToPly(i){
  if(i<0){ state.previewIndex = 0; state.previewIndex = null; state._jumpStart=true; }
  render();
}

/* ============ takeback logic ============ */
function canITakeback(room, color, liveChess){
  if(color!=='w' && color!=='b') return false;
  if(room.moves.length===0) return false;
  const history = liveChess.history({verbose:false});
  // last move's mover color
  const lastMoveColor = (room.moves.length % 2 === 1) ? 'w' : 'b';
  return lastMoveColor===color && !liveChess.game_over();
}

async function doTakeback(){
  if(state.pendingTakeback) return;
  state.pendingTakeback = true;
  render();
  const room = await loadRoom(state.roomCode);
  if(!room || room.moves.length===0){ state.pendingTakeback=false; render(); return; }
  room.moves = room.moves.slice(0, -1);
  room.moveMeta = room.moveMeta.slice(0, -1);
  room.status = 'active';
  room.resultText = null;
  await saveRoom(room);
  state.room = room;
  state.chess = replay(room.moves);
  state.pendingTakeback = false;
  state.previewIndex = null;
  toast('Move taken back');
  render();
}

/* ============ board drawing & interaction ============ */
function squareName(file, rank){ // file 0-7 (a-h), rank 0-7 (rank1..8)
  return 'abcdefgh'[file] + (rank+1);
}

function drawBoard(boardEl, chess, flip, interactive){
  boardEl.innerHTML='';
  const boardData = chess.board(); // 8x8, [0]=rank8 .. [7]=rank1
  const inCheckColor = chess.in_check() ? chess.turn() : null;
  let kingSquareInCheck = null;
  if(inCheckColor){
    for(let r=0;r<8;r++) for(let f=0;f<8;f++){
      const p = boardData[r][f];
      if(p && p.type==='k' && p.color===inCheckColor){
        kingSquareInCheck = squareName(f, 7-r);
      }
    }
  }

  const order = [];
  for(let visRow=0; visRow<8; visRow++){
    for(let visCol=0; visCol<8; visCol++){
      let dataRow = visRow, dataCol = visCol;
      if(flip){ dataRow = 7-visRow; dataCol = 7-visCol; }
      order.push([dataRow, dataCol]);
    }
  }

  for(const [dataRow, dataCol] of order){
    const file = dataCol; // 0-7 a-h
    const rank = 7-dataRow; // 0-7 -> rank index (0=rank1)
    const sqName = squareName(file, rank);
    const isLight = (file+rank)%2===1;
    const sq = el('div','sq '+(isLight?'light':'dark'));
    sq.dataset.square = sqName;

    if(state.lastMoveSquares && state.lastMoveSquares.includes(sqName)){
      sq.classList.add('last');
    }
    if(kingSquareInCheck===sqName){
      sq.classList.add('in-check');
    }
    if(state.selected===sqName){
      sq.classList.add('selected');
    }

    const piece = boardData[dataRow][dataCol];
    if(piece){
      const p = el('span','piece', PIECES[piece.color][piece.type]);
      p.style.color = piece.color==='w' ? '#fdfefe' : '#182238';
      p.style.webkitTextStroke = piece.color==='w' ? '1px rgba(70,90,120,0.55)' : '1px rgba(255,255,255,0.25)';
      sq.appendChild(p);
    }

    if(state.legalTargets.includes(sqName)){
      const targetPieceHere = !!piece;
      sq.appendChild(el('span', targetPieceHere? 'ring-capture':'dot-move'));
    }

    // coordinate labels on edge squares
    if(rank===0){ sq.appendChild(el('span','coord file', 'abcdefgh'[file])); }
    if(file===(flip?7:0)){ sq.appendChild(el('span','coord rank', String(rank+1))); }

    if(interactive){
      sq.addEventListener('click', ()=> onSquareClick(sqName));
    }
    boardEl.appendChild(sq);
  }
}

function onSquareClick(sqName){
  const chess = state.chess;
  if(chess.turn()!==state.color){ 
    // allow selecting own pieces only when it's your turn; otherwise just ignore silently
  }
  if(state.selected){
    if(state.legalTargets.includes(sqName)){
      attemptMove(state.selected, sqName);
      return;
    }
    // clicking another own piece re-selects
    const piece = chess.get(sqName);
    if(piece && piece.color===state.color){
      selectSquare(sqName);
    } else {
      state.selected=null; state.legalTargets=[];
      render();
    }
    return;
  }
  const piece = chess.get(sqName);
  if(piece && piece.color===state.color && chess.turn()===state.color){
    selectSquare(sqName);
  }
}

function selectSquare(sqName){
  const chess = state.chess;
  const moves = chess.moves({square: sqName, verbose:true});
  state.selected = sqName;
  state.legalTargets = moves.map(m=>m.to);
  render();
}

async function attemptMove(from, to){
  const chess = state.chess;
  // detect promotion need
  const piece = chess.get(from);
  let promotion = undefined;
  if(piece && piece.type==='p' && (to[1]==='8'||to[1]==='1')){
    promotion = await askPromotion();
  }
  const moveObj = { from, to, promotion: promotion||'q' };
  const result = chess.move(moveObj);
  state.selected=null; state.legalTargets=[];
  if(!result){ render(); return; }

  // push to shared room
  const room = await loadRoom(state.roomCode) || state.room;
  room.moves.push(result.san);
  room.moveMeta.push({by: state.color});
  room.status = chess.game_over() ? 'over' : 'active';
  await saveRoom(room);
  state.room = room;
  state.lastMoveSquares = [from, to];
  render();
}

function askPromotion(){
  return new Promise(resolve=>{
    const backdrop = el('div','modal-backdrop');
    const modal = el('div','modal glass-strong');
    modal.innerHTML = `<h2>Promote pawn</h2><p>Choose a piece</p>`;
    const row = el('div','row');
    const options = [['q','♕ Queen'],['r','♖ Rook'],['b','♗ Bishop'],['n','♘ Knight']];
    options.forEach(([code,label])=>{
      const b = el('button','btn small', label);
      b.style.marginBottom='8px';
      b.onclick = ()=>{ document.body.removeChild(backdrop); resolve(code); };
      row.appendChild(b);
    });
    row.style.flexWrap='wrap';
    modal.appendChild(row);
    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);
  });
}

/* ============ boot ============ */
render();

})();
</script>
