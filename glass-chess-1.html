<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Glass Chess</title>
<style>
  :root{
    --glass-bg: rgba(255,255,255,0.14);
    --glass-bg-strong: rgba(255,255,255,0.22);
    --glass-border: rgba(255,255,255,0.35);
    --ink: #0b1e33;
    --ink-soft: rgba(11,30,51,0.62);
    --accent: #3ec9ff;
    --accent-2: #6a7bff;
    --white-piece: #f8fbff;
    --black-piece: #16233a;
    --light-sq: rgba(255,255,255,0.55);
    --dark-sq: rgba(120,150,190,0.38);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    overflow-x:hidden;
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(1100px 700px at 15% -10%, #bfe9ff 0%, rgba(191,233,255,0) 60%),
      radial-gradient(1000px 800px at 110% 10%, #d9d0ff 0%, rgba(217,208,255,0) 55%),
      radial-gradient(900px 700px at 50% 120%, #ffe3f1 0%, rgba(255,227,241,0) 60%),
      linear-gradient(160deg, #eaf3ff 0%, #f4f0ff 45%, #ffeef6 100%);
    background-attachment: fixed;
  }
  .app{
    max-width: 560px;
    margin: 0 auto;
    min-height:100dvh;
    padding: max(18px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }

  /* ---------- glass primitives ---------- */
  .glass{
    background: var(--glass-bg);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.6) inset,
      0 8px 30px rgba(31,60,110,0.14);
  }
  .glass-strong{
    background: var(--glass-bg-strong);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.7) inset,
      0 10px 40px rgba(31,60,110,0.18);
  }
  button{ font-family:inherit; }
  .btn{
    appearance:none; border:none; cursor:pointer;
    padding: 14px 20px;
    border-radius: 18px;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    background: var(--glass-bg-strong);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 6px 18px rgba(31,60,110,0.14);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active{ transform: scale(0.96); box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 2px 8px rgba(31,60,110,0.14); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.primary{
    color:#fff;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 8px 22px rgba(80,120,255,0.35);
  }
  .btn.danger{
    color:#a3213a;
  }
  .btn.small{ padding:9px 14px; font-size:13px; border-radius:14px; }
  input[type=text]{
    font-family:inherit;
    font-size: 22px;
    font-weight:700;
    letter-spacing: 4px;
    text-align:center;
    text-transform:uppercase;
    color: var(--ink);
    background: rgba(255,255,255,0.35);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 14px 10px;
    width:100%;
    outline:none;
  }
  input[type=text]::placeholder{ color: rgba(11,30,51,0.3); letter-spacing:2px; font-weight:600;}

  /* ---------- landing ---------- */
  .brand{
    text-align:center;
    margin: 18px 0 28px;
  }
  .brand .mark{
    width:64px;height:64px;margin:0 auto 12px;
    border-radius: 20px;
    display:flex;align-items:center;justify-content:center;
    font-size:34px;
    background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.25));
    border:1px solid var(--glass-border);
    box-shadow: 0 10px 30px rgba(90,120,255,0.25), 0 1px 0 rgba(255,255,255,0.8) inset;
  }
  .brand h1{
    margin:0; font-size:28px; letter-spacing:-0.02em; font-weight:800;
    background: linear-gradient(135deg, #1a2b4a, #4a5fc7 60%, #1a2b4a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand p{ margin:6px 0 0; color:var(--ink-soft); font-size:14px; }

  .card{
    border-radius: 26px;
    padding: 22px;
    margin-bottom: 16px;
  }
  .card h2{ margin:0 0 4px; font-size:15px; font-weight:700; }
  .card .sub{ margin:0 0 14px; font-size:13px; color:var(--ink-soft); }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  .divider{
    display:flex; align-items:center; gap:12px; margin: 18px 0; color: var(--ink-soft); font-size:12px; font-weight:600;
  }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background: rgba(11,30,51,0.15); }

  /* ---------- game screen ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    border-radius: 20px;
    padding: 12px 16px;
    margin-bottom: 14px;
  }
  .topbar .room{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .topbar .room b{ color:var(--ink); letter-spacing:2px; font-size:15px; }
  .players{
    display:flex; justify-content:space-between; align-items:center;
    border-radius: 20px; padding: 12px 16px; margin-bottom: 12px;
    gap: 10px;
  }
  .player{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; }
  .player .dot{ width:12px; height:12px; border-radius:50%; border:1px solid rgba(0,0,0,0.15); }
  .player.you{ color: var(--accent-2); }
  .turn-pill{
    font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px;
    background: rgba(62,201,255,0.18); color:#0a6a8f; border:1px solid rgba(62,201,255,0.35);
  }
  .turn-pill.mine{ background: linear-gradient(135deg, var(--accent-2), var(--accent)); color:#fff; border-color:transparent; }

  .board-wrap{
    border-radius: 28px;
    padding: 12px;
    margin-bottom: 14px;
    position:relative;
  }
  #board{
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width:100%;
    aspect-ratio: 1/1;
    border-radius: 18px;
    overflow:hidden;
    border: 1px solid rgba(255,255,255,0.5);
  }
  .sq{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    font-size: 7.2vw;
    max-font-size: 40px;
    user-select:none;
    cursor:pointer;
  }

  .sq.light{ background: var(--light-sq); }
  .sq.dark{ background: var(--dark-sq); }
  .sq .piece{
    line-height:1;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    transition: transform .12s ease;
  }
  .sq.selected::after{
    content:""; position:absolute; inset:4%;
    border-radius: 30%;
    box-shadow: 0 0 0 3px rgba(62,201,255,0.9) inset;
  }
  .sq.last::before{
    content:""; position:absolute; inset:0;
    background: rgba(255, 214, 92, 0.35);
  }
  .sq .dot-move{
    position:absolute; width:26%; height:26%; border-radius:50%;
    background: rgba(20,40,80,0.28);
  }
  .sq .ring-capture{
    position:absolute; inset:6%; border-radius:30%;
    box-shadow: 0 0 0 4px rgba(20,40,80,0.28) inset;
  }
  .sq.in-check::before{
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle, rgba(255,80,80,0.55), rgba(255,80,80,0) 70%);
  }
  .coord{
    position:absolute; font-size:9px; font-weight:700; opacity:0.35; pointer-events:none;
  }
  .coord.file{ bottom:2px; right:3px; }
  .coord.rank{ top:2px; left:3px; }

  .status-strip{
    text-align:center; font-size:13px; font-weight:600; color: var(--ink-soft);
    padding: 6px 4px 14px;
    min-height: 18px;
  }

  .controls{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .controls .btn{ flex:1; }

  .history-card{
    border-radius: 22px; padding: 16px 16px 8px; margin-bottom: 14px;
  }
  .history-card h3{ margin:0 0 10px; font-size:13px; font-weight:700; color: var(--ink-soft); display:flex; justify-content:space-between; align-items:center;}
  .moves{
    display:grid; grid-template-columns: 28px 1fr 1fr; gap:4px 8px;
    max-height: 160px; overflow-y:auto; font-size:14px; padding-bottom:8px;
  }
  .moves .num{ color:var(--ink-soft); font-weight:600; font-size:12px; padding-top:6px;}
  .movecell{
    padding:6px 8px; border-radius:10px; font-weight:600; cursor:pointer;
    background: rgba(255,255,255,0.25);
  }
  .movecell.active{ background: linear-gradient(135deg, var(--accent-2), var(--accent)); color:#fff; }
  .movecell:empty{ background:none; cursor:default; }

  .preview-banner{
    display:flex; align-items:center; justify-content:space-between;
    border-radius: 16px; padding: 10px 14px; margin-bottom: 10px;
    background: rgba(255,214,92,0.25); border:1px solid rgba(255,180,60,0.4);
    font-size:13px; font-weight:600;
  }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    padding: 12px 20px; border-radius:16px; font-size:14px; font-weight:600;
    opacity:0; transition: all .25s ease; pointer-events:none; z-index:50;
    max-width: 88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .hidden{ display:none !important; }

  .footer-note{ text-align:center; font-size:11px; color: var(--ink-soft); margin-top:auto; padding-top:18px; }

  ::-webkit-scrollbar{ width:5px; height:5px; }
  ::-webkit-scrollbar-thumb{ background: rgba(11,30,51,0.2); border-radius:10px; }

  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(11,30,51,0.2); border-top-color: var(--accent-2);
    animation: spin .8s linear infinite; display:inline-block; vertical-align:-3px; margin-right:6px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .modal-backdrop{
    position:fixed; inset:0; background: rgba(20,30,50,0.25); backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center; z-index:60; padding:24px;
  }
  .modal{
    border-radius:26px; padding:26px; max-width:340px; width:100%; text-align:center;
  }
  .modal .big{ font-size:44px; margin-bottom:6px; }
  .modal h2{ margin:0 0 6px; font-size:20px; }
  .modal p{ margin:0 0 18px; font-size:14px; color:var(--ink-soft); }
</style>
</head>

const PARSER_STRICT = 0
const PARSER_SLOPPY = 1

/* this function is used to uniquely identify ambiguous moves */
function get_disambiguator(move, moves) {
  var from = move.from
  var to = move.to
  var piece = move.piece

  var ambiguities = 0
  var same_rank = 0
  var same_file = 0

  for (var i = 0, len = moves.length; i < len; i++) {
    var ambig_from = moves[i].from
    var ambig_to = moves[i].to
    var ambig_piece = moves[i].piece

    /* if a move of the same piece type ends on the same to square, we'll
     * need to add a disambiguator to the algebraic notation
     */
    if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
      ambiguities++

      if (rank(from) === rank(ambig_from)) {
        same_rank++
      }

      if (file(from) === file(ambig_from)) {
        same_file++
      }
    }
  }

  if (ambiguities > 0) {
    /* if there exists a similar moving piece on the same rank and file as
     * the move in question, use the square as the disambiguator
     */
    if (same_rank > 0 && same_file > 0) {
      return algebraic(from)
    } else if (same_file > 0) {
      /* if the moving piece rests on the same file, use the rank symbol as the
       * disambiguator
       */
      return algebraic(from).charAt(1)
    } else {
      /* else use the file symbol */
      return algebraic(from).charAt(0)
    }
  }

  return ''
}

function infer_piece_type(san) {
  var piece_type = san.charAt(0)
  if (piece_type >= 'a' && piece_type <= 'h') {
    var matches = san.match(/[a-h]\d.*[a-h]\d/)
    if (matches) {
      return undefined
    }
    return PAWN
  }
  piece_type = piece_type.toLowerCase()
  if (piece_type === 'o') {
    return KING
  }
  return piece_type
}

// parses all of the decorators out of a SAN string
function stripped_san(move) {
  return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
}

/*****************************************************************************
 * UTILITY FUNCTIONS
 ****************************************************************************/
function rank(i) {
  return i >> 4
}

function file(i) {
  return i & 15
}

function algebraic(i) {
  var f = file(i),
    r = rank(i)
  return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
}

function swap_color(c) {
  return c === WHITE ? BLACK : WHITE
}

function is_digit(c) {
  return '0123456789'.indexOf(c) !== -1
}

function clone(obj) {
  var dupe = obj instanceof Array ? [] : {}

  for (var property in obj) {
    if (typeof property === 'object') {
      dupe[property] = clone(obj[property])
    } else {
      dupe[property] = obj[property]
    }
  }

  return dupe
}

function trim(str) {
  return str.replace(/^\s+|\s+$/g, '')
}

/***************************************************************************
 * PUBLIC CONSTANTS

const BLACK = 'b'
const WHITE = 'w'

const EMPTY = -1

const PAWN = 'p'
const KNIGHT = 'n'
const BISHOP = 'b'
const ROOK = 'r'
const QUEEN = 'q'
const KING = 'k'

const SQUARES = (function () {
  /* from the ECMA-262 spec (section 12.6.4):
   * "The mechanics of enumerating the properties ... is
   * implementation dependent"
   * so: for (var sq in SQUARES) { keys.push(sq); } might not be
   * ordered correctly
   */
  var keys = []
  for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
    if (i & 0x88) {
      i += 7
      continue
    }
    keys.push(algebraic(i))
  }
  return keys
})()

const FLAGS = {
  NORMAL: 'n',
  CAPTURE: 'c',
  BIG_PAWN: 'b',
  EP_CAPTURE: 'e',
  PROMOTION: 'p',
  KSIDE_CASTLE: 'k',
  QSIDE_CASTLE: 'q',
}

const Chess = function (fen) {
  var board = new Array(128)
  var kings = { w: EMPTY, b: EMPTY }
  var turn = WHITE
  var castling = { w: 0, b: 0 }
  var ep_square = EMPTY
  var half_moves = 0
  var move_number = 1
  var history = []
  var header = {}
  var comments = {}

  /* if the user passes in a fen string, load it, else default to
   * starting position
   */
  if (typeof fen === 'undefined') {
    load(DEFAULT_POSITION)
  } else {
    load(fen)
  }

  function clear(keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    board = new Array(128)
    kings = { w: EMPTY, b: EMPTY }
    turn = WHITE
    castling = { w: 0, b: 0 }
    ep_square = EMPTY
    half_moves = 0
    move_number = 1
    history = []
    if (!keep_headers) header = {}
    comments = {}
    update_setup(generate_fen())
  }

  function prune_comments() {
    var reversed_history = []
    var current_comments = {}
    var copy_comment = function (fen) {
      if (fen in comments) {
        current_comments[fen] = comments[fen]
      }
    }
    while (history.length > 0) {
      reversed_history.push(undo_move())
    }
    copy_comment(generate_fen())
    while (reversed_history.length > 0) {
      make_move(reversed_history.pop())
      copy_comment(generate_fen())
    }
    comments = current_comments
  }

  function reset() {
    load(DEFAULT_POSITION)
  }

  function load(fen, keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    var tokens = fen.split(/\s+/)
    var position = tokens[0]
    var square = 0

    if (!validate_fen(fen).valid) {
      return false
    }

    clear(keep_headers)

    for (var i = 0; i < position.length; i++) {
      var piece = position.charAt(i)

      if (piece === '/') {
        square += 8
      } else if (is_digit(piece)) {
        square += parseInt(piece, 10)
      } else {
        var color = piece < 'a' ? WHITE : BLACK
        put({ type: piece.toLowerCase(), color: color }, algebraic(square))
        square++
      }
    }

    turn = tokens[1]

    if (tokens[2].indexOf('K') > -1) {
      castling.w |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('Q') > -1) {
      castling.w |= BITS.QSIDE_CASTLE
    }
    if (tokens[2].indexOf('k') > -1) {
      castling.b |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('q') > -1) {
      castling.b |= BITS.QSIDE_CASTLE
    }

    ep_square = tokens[3] === '-' ? EMPTY : SQUARE_MAP[tokens[3]]
    half_moves = parseInt(tokens[4], 10)
    move_number = parseInt(tokens[5], 10)

    update_setup(generate_fen())

    return true
  }

  /* TODO: this function is pretty much crap - it validates structure but
   * completely ignores content (e.g. doesn't verify that each side has a king)
   * ... we should rewrite this, and ditch the silly error_number field while
   * we're at it
   */
  function validate_fen(fen) {
    var errors = {
      0: 'No errors.',
      1: 'FEN string must contain six space-delimited fields.',
      2: '6th field (move number) must be a positive integer.',
      3: '5th field (half move counter) must be a non-negative integer.',
      4: '4th field (en-passant square) is invalid.',
      5: '3rd field (castling availability) is invalid.',
      6: '2nd field (side to move) is invalid.',
      7: "1st field (piece positions) does not contain 8 '/'-delimited rows.",
      8: '1st field (piece positions) is invalid [consecutive numbers].',
      9: '1st field (piece positions) is invalid [invalid piece].',
      10: '1st field (piece positions) is invalid [row too large].',
      11: 'Illegal en-passant square',
    }

    /* 1st criterion: 6 space-seperated fields? */
    var tokens = fen.split(/\s+/)
    if (tokens.length !== 6) {
      return { valid: false, error_number: 1, error: errors[1] }
    }

    /* 2nd criterion: move number field is a integer value > 0? */
    if (isNaN(parseInt(tokens[5])) || parseInt(tokens[5], 10) <= 0) {
      return { valid: false, error_number: 2, error: errors[2] }
    }

    /* 3rd criterion: half move counter is an integer >= 0? */
    if (isNaN(parseInt(tokens[4])) || parseInt(tokens[4], 10) < 0) {
      return { valid: false, error_number: 3, error: errors[3] }
    }

    /* 4th criterion: 4th field is a valid e.p.-string? */
    if (!/^(-|[abcdefgh][36])$/.test(tokens[3])) {
      return { valid: false, error_number: 4, error: errors[4] }
    }

    /* 5th criterion: 3th field is a valid castle-string? */
    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }
    }

    /* 7th criterion: 1st field contains 8 rows? */
    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {
      /* check for right sum of fields AND not two numbers in succession */
      var sum_fields = 0
      var previous_was_number = false

      for (var k = 0; k < rows[i].length; k++) {
        if (!isNaN(rows[i][k])) {
          if (previous_was_number) {
            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false
        }
      }
      if (sum_fields !== 8) {
        return { valid: false, error_number: 10, error: errors[10] }
      }
    }

    if (
      (tokens[3][1] == '3' && tokens[1] == 'w') ||
      (tokens[3][1] == '6' && tokens[1] == 'b')
    ) {
      return { valid: false, error_number: 11, error: errors[11] }
    }

    /* everything's okay! */
    return { valid: true, error_number: 0, error: errors[0] }
  }

  function generate_fen() {
    var empty = 0
    var fen = ''

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      if (board[i] == null) {
        empty++
      } else {
        if (empty > 0) {
          fen += empty
          empty = 0
        }
        var color = board[i].color
        var piece = board[i].type

        fen += color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
      }

      if ((i + 1) & 0x88) {
        if (empty > 0) {
          fen += empty
        }

        if (i !== SQUARE_MAP.h1) {
          fen += '/'
        }

        empty = 0
        i += 8
      }
    }

    var cflags = ''
    if (castling[WHITE] & BITS.KSIDE_CASTLE) {
      cflags += 'K'
    }
    if (castling[WHITE] & BITS.QSIDE_CASTLE) {
      cflags += 'Q'
    }
    if (castling[BLACK] & BITS.KSIDE_CASTLE) {
      cflags += 'k'
    }
    if (castling[BLACK] & BITS.QSIDE_CASTLE) {
      cflags += 'q'
    }

    /* do we have an empty castling flag? */
    cflags = cflags || '-'
    var epflags = ep_square === EMPTY ? '-' : algebraic(ep_square)

    return [fen, turn, cflags, epflags, half_moves, move_number].join(' ')
  }

  function set_header(args) {
    for (var i = 0; i < args.length; i += 2) {
      if (typeof args[i] === 'string' && typeof args[i + 1] === 'string') {
        header[args[i]] = args[i + 1]
      }
    }
    return header
  }

  /* called when the initial board setup is changed with put() or remove().
   * modifies the SetUp and FEN properties of the header object.  if the FEN is
   * equal to the default position, the SetUp and FEN are deleted
   * the setup is only updated if history.length is zero, ie moves haven't been
   * made.
   */
  function update_setup(fen) {
    if (history.length > 0) return

    if (fen !== DEFAULT_POSITION) {
      header['SetUp'] = '1'
      header['FEN'] = fen
    } else {
      delete header['SetUp']
      delete header['FEN']
    }
  }

  function get(square) {
    var piece = board[SQUARE_MAP[square]]
    return piece ? { type: piece.type, color: piece.color } : null
  }

  function put(piece, square) {
    /* check for valid piece object */
    if (!('type' in piece && 'color' in piece)) {
      return false
    }

    /* check for piece */
    if (SYMBOLS.indexOf(piece.type.toLowerCase()) === -1) {
      return false
    }

    /* check for valid square */
    if (!(square in SQUARE_MAP)) {
      return false
    }

    var sq = SQUARE_MAP[square]

    /* don't let the user place more than one king */
    if (
      piece.type == KING &&
      !(kings[piece.color] == EMPTY || kings[piece.color] == sq)
    ) {
      return false
    }

    board[sq] = { type: piece.type, color: piece.color }
    if (piece.type === KING) {
      kings[piece.color] = sq
    }

    update_setup(generate_fen())

    return true
  }

  function remove(square) {
    var piece = get(square)
    board[SQUARE_MAP[square]] = null
    if (piece && piece.type === KING) {
      kings[piece.color] = EMPTY
    }

    update_setup(generate_fen())

    return piece
  }

  function build_move(board, from, to, flags, promotion) {
    var move = {
      color: turn,
      from: from,
      to: to,
      flags: flags,
      piece: board[from].type,
    }

    if (promotion) {
      move.flags |= BITS.PROMOTION
      move.promotion = promotion
    }

    if (board[to]) {
      move.captured = board[to].type
    } else if (flags & BITS.EP_CAPTURE) {
      move.captured = PAWN
    }
    return move
  }

  function generate_moves(options) {
    function add_move(board, moves, from, to, flags) {
      /* if pawn promotion */
      if (
        board[from].type === PAWN &&
        (rank(to) === RANK_8 || rank(to) === RANK_1)
      ) {
        var pieces = [QUEEN, ROOK, BISHOP, KNIGHT]
        for (var i = 0, len = pieces.length; i < len; i++) {
          moves.push(build_move(board, from, to, flags, pieces[i]))
        }
      } else {
        moves.push(build_move(board, from, to, flags))
      }
    }

    var moves = []
    var us = turn
    var them = swap_color(us)
    var second_rank = { b: RANK_7, w: RANK_2 }

    var first_sq = SQUARE_MAP.a8
    var last_sq = SQUARE_MAP.h1
    var single_square = false

    /* do we want legal moves? */
    var legal =
      typeof options !== 'undefined' && 'legal' in options
        ? options.legal
        : true

    var piece_type =
      typeof options !== 'undefined' &&
      'piece' in options &&
      typeof options.piece === 'string'
        ? options.piece.toLowerCase()
        : true

    /* are we generating moves for a single square? */
    if (typeof options !== 'undefined' && 'square' in options) {
      if (options.square in SQUARE_MAP) {
        first_sq = last_sq = SQUARE_MAP[options.square]
        single_square = true
      } else {
        /* invalid square */
        return []
      }
    }

    for (var i = first_sq; i <= last_sq; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue
      }

      if (piece.type === PAWN && (piece_type === true || piece_type === PAWN)) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else if (piece_type === true || piece_type === piece.type) {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)
              break
            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }
      }
    }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square
     */
    if (piece_type === true || piece_type === KING) {
      if (!single_square || last_sq === kings[us]) {
        /* king-side castling */
        if (castling[us] & BITS.KSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from + 2

          if (
            board[castling_from + 1] == null &&
            board[castling_to] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from + 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
          }
        }

        /* queen-side castling */
        if (castling[us] & BITS.QSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from - 2

          if (
            board[castling_from - 1] == null &&
            board[castling_from - 2] == null &&
            board[castling_from - 3] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from - 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
          }
        }
      }
    }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {
        legal_moves.push(moves[i])
      }
      undo_move()
    }

    return legal_moves
  }

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation
   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, moves) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      if (move.piece !== PAWN) {
        var disambiguator = get_disambiguator(move, moves)
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  function attacked(color, square) {
    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen().split(' ').slice(0, 4).join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number,
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {

    state.roomCode = code;

  }

async function onJoinRoom(code){
  if(!code || code.length<3){ toast('Enter a valid room code'); return; }
  let room;
  try{
    room = await loadRoom(code);
  }catch(e){
    console.error(e);
    toast('Could not reach the database — check Settings');
    return;
  }
  if(!room){ toast('Room not found'); return; }

  try{
    // figure out seat
    if(room.white && room.white.id===MY_ID){ state.color='w'; }
    else if(room.black && room.black.id===MY_ID){ state.color='b'; }
    else if(!room.black){
      room.black = { id: MY_ID, joinedAt: Date.now() };
      room.status = room.white ? 'active' : 'waiting';
      await saveRoom(room);
      state.color='b';
    } else if(!room.white){
      room.white = { id: MY_ID, joinedAt: Date.now() };
      room.status = 'active';
      await saveRoom(room);
      state.color='w';
    } else {
      // room full, join as spectator (view only) as black perspective viewer
      state.color = 'spectator';
      toast('Room is full — joining as spectator');
    }
  }catch(e){
    console.error(e);
    toast('Could not join — check your database URL in Settings');
    return;
  }

  state.roomCode = code;
  state.room = room;
  state.chess = replay(room.moves);
  state.screen = (room.white && room.black) ? 'game' : 'lobby';

async function pollRoom(){
  if(!state.roomCode) return;
  const fresh = await loadRoom(state.roomCode);
  if(!fresh) return;
  const prevMoveCount = state.room ? state.room.moves.length : 0;
  const changed = JSON.stringify(fresh) !== JSON.stringify(state.room);
  state.room = fresh;

    // seat got overwritten somehow; ignore

  if(state.screen==='lobby' && fresh.white && fresh.black){
    state.screen='game';
  }

  if(changed){
    state.chess = replay(fresh.moves);
    if(fresh.moves.length>prevMoveCount){
      const lastSan = fresh.moves[fresh.moves.length-1];
      // figure out from/to of last move by diffing chess history verbose
      const verbose = replayVerbose(fresh.moves);
      const lastV = verbose[verbose.length-1];
      state.lastMoveSquares = lastV ? [lastV.from, lastV.to] : null;
      if(state.previewIndex===null){
        // subtle notification if it was opponent's move
      }
    }
    if(state.previewIndex===null){
      state.selected=null; state.legalTargets=[];
    }
    render();
  }
}

function replayVerbose(moves){
  const c = new Chess();
  const out=[];
  for(const m of moves){
    const r = c.move(m);
    if(!r) break;
    out.push(r);
  }
  return out;
}

function jumpToPly(i){
  if(i<0){ state.previewIndex = 0; state.previewIndex = null; state._jumpStart=true; }
  render();
}

/* ============ takeback logic ============ */
function canITakeback(room, color, liveChess){
  if(color!=='w' && color!=='b') return false;
  if(room.moves.length===0) return false;
  const history = liveChess.history({verbose:false});
  // last move's mover color
  const lastMoveColor = (room.moves.length % 2 === 1) ? 'w' : 'b';
  return lastMoveColor===color && !liveChess.game_over();
}

async function doTakeback(){
  if(state.pendingTakeback) return;
  state.pendingTakeback = true;
  render();
  try{
    const room = await loadRoom(state.roomCode);
    if(!room || room.moves.length===0){ state.pendingTakeback=false; render(); return; }
    room.moves = room.moves.slice(0, -1);
    room.moveMeta = room.moveMeta.slice(0, -1);
    room.status = 'active';
    room.resultText = null;
    await saveRoom(room);
    state.room = room;
    state.chess = replay(room.moves);
    state.previewIndex = null;
    toast('Move taken back');
  }catch(e){
    console.error(e);
    toast('Could not undo — check your connection');
  }finally{
    state.pendingTakeback = false;
    render();
  }
}

/* ============ board drawing & interaction ============ */
function squareName(file, rank){ // file 0-7 (a-h), rank 0-7 (rank1..8)
  return 'abcdefgh'[file] + (rank+1);
}

function drawBoard(boardEl, chess, flip, interactive){
  boardEl.innerHTML='';
  const boardData = chess.board(); // 8x8, [0]=rank8 .. [7]=rank1
  const inCheckColor = chess.in_check() ? chess.turn() : null;
  let kingSquareInCheck = null;
  if(inCheckColor){
    for(let r=0;r<8;r++) for(let f=0;f<8;f++){
      const p = boardData[r][f];
      if(p && p.type==='k' && p.color===inCheckColor){
        kingSquareInCheck = squareName(f, 7-r);
      }
    }
  }

  const order = [];
  for(let visRow=0; visRow<8; visRow++){
    for(let visCol=0; visCol<8; visCol++){
      let dataRow = visRow, dataCol = visCol;
      if(flip){ dataRow = 7-visRow; dataCol = 7-visCol; }
      order.push([dataRow, dataCol]);
    }
  }

  for(const [dataRow, dataCol] of order){
    const file = dataCol; // 0-7 a-h
    const rank = 7-dataRow; // 0-7 -> rank index (0=rank1)
    const sqName = squareName(file, rank);
    const isLight = (file+rank)%2===1;
    const sq = el('div','sq '+(isLight?'light':'dark'));
    sq.dataset.square = sqName;

    if(state.lastMoveSquares && state.lastMoveSquares.includes(sqName)){
      sq.classList.add('last');
    }
    if(kingSquareInCheck===sqName){
      sq.classList.add('in-check');
    }
    if(state.selected===sqName){
      sq.classList.add('selected');
    }

    const piece = boardData[dataRow][dataCol];
    if(piece){
      const p = el('span','piece', PIECES[piece.color][piece.type]);
      p.style.color = piece.color==='w' ? '#fdfefe' : '#182238';
      p.style.webkitTextStroke = piece.color==='w' ? '1px rgba(70,90,120,0.55)' : '1px rgba(255,255,255,0.25)';
      sq.appendChild(p);
    }

    if(state.legalTargets.includes(sqName)){
      const targetPieceHere = !!piece;
      sq.appendChild(el('span', targetPieceHere? 'ring-capture':'dot-move'));
    }

    // coordinate labels on edge squares
    if(rank===0){ sq.appendChild(el('span','coord file', 'abcdefgh'[file])); }
    if(file===(flip?7:0)){ sq.appendChild(el('span','coord rank', String(rank+1))); }

    if(interactive){
      sq.addEventListener('click', ()=> onSquareClick(sqName));
    }
    boardEl.appendChild(sq);
  }
}

function onSquareClick(sqName){
  const chess = state.chess;
  if(chess.turn()!==state.color){ 
    // allow selecting own pieces only when it's your turn; otherwise just ignore silently
  }
  if(state.selected){
    if(state.legalTargets.includes(sqName)){
      attemptMove(state.selected, sqName);
      return;
    }
    // clicking another own piece re-selects
    const piece = chess.get(sqName);
    if(piece && piece.color===state.color){
      selectSquare(sqName);
    } else {
      state.selected=null; state.legalTargets=[];
      render();
    }
    return;
  }
  const piece = chess.get(sqName);
  if(piece && piece.color===state.color && chess.turn()===state.color){
    selectSquare(sqName);
  }
}

function selectSquare(sqName){
  const chess = state.chess;
  const moves = chess.moves({square: sqName, verbose:true});
  state.selected = sqName;
  state.legalTargets = moves.map(m=>m.to);
  render();
}

async function attemptMove(from, to){
  const chess = state.chess;
  // detect promotion need
  const piece = chess.get(from);
  let promotion = undefined;
  if(piece && piece.type==='p' && (to[1]==='8'||to[1]==='1')){
    promotion = await askPromotion();
  }
  const moveObj = { from, to, promotion: promotion||'q' };
  const result = chess.move(moveObj);
  state.selected=null; state.legalTargets=[];
  if(!result){ render(); return; }

  // push to shared room
  try{
    const room = await loadRoom(state.roomCode) || state.room;
    room.moves.push(result.san);
    room.moveMeta.push({by: state.color});
    room.status = chess.game_over() ? 'over' : 'active';
    await saveRoom(room);
    state.room = room;
    state.lastMoveSquares = [from, to];
  }catch(e){
    console.error(e);
    chess.undo();
    toast('Move failed to sync — check your connection');
  }
  render();
}

function askPromotion(){
  return new Promise(resolve=>{
    const backdrop = el('div','modal-backdrop');
    const modal = el('div','modal glass-strong');
    modal.innerHTML = `<h2>Promote pawn</h2><p>Choose a piece</p>`;
    const row = el('div','row');
    const options = [['q','♕ Queen'],['r','♖ Rook'],['b','♗ Bishop'],['n','♘ Knight']];
    options.forEach(([code,label])=>{
      const b = el('button','btn small', label);
      b.style.marginBottom='8px';
      b.onclick = ()=>{ document.body.removeChild(backdrop); resolve(code); };
      row.appendChild(b);
    });
    row.style.flexWrap='wrap';
    modal.appendChild(row);
    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);
  });
}

window.addEventListener('error', function(e){
  console.error('Uncaught error:', e.error || e.message);
  const appEl = document.getElementById('app');
  if(appEl && !appEl.innerHTML.trim()){
    appEl.innerHTML =
      '<div style="padding:40px 20px;text-align:center;font-family:sans-serif;color:#7a1f3a;">'+
      '<div style="font-size:40px;margin-bottom:10px;">⚠️</div>'+
      '<b>Something went wrong.</b><br><br>'+
      '<span style="font-size:13px;opacity:.8;">'+String((e.error && e.error.message) || e.message)+'</span>'+
      '</div>';
  }
});

/* ============ boot ============ */
try{
  if(!getDbUrl()){ state.screen = 'setup'; }
  render();
}catch(err){
  console.error('Boot failed:', err);
  document.getElementById('app').innerHTML =
    '<div style="padding:40px 20px;text-align:center;font-family:sans-serif;color:#7a1f3a;">'+
    '<div style="font-size:40px;margin-bottom:10px;">⚠️</div>'+
    '<b>Something went wrong loading the app.</b><br><br>'+
    '<span style="font-size:13px;opacity:.8;">'+String(err && err.message || err)+'</span>'+
    '</div>';
}

})();
</script>
</body>
